name: CI

on:
  push:
    branches: [publish]
  pull_request:
    branches: [publish]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "JOBBOT_CHROME=/usr/bin/chromium-browser" >> $GITHUB_ENV
      - run: npm ci
      - run: npm test
      - run: npm run osv
